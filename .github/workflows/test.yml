name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin-rescue:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Syntax check
        run: |
          bash -n tools/plugin-rescue/bin/omrescue
          bash -n tools/plugin-rescue/install.sh
          bash -n tools/plugin-rescue/test/run.sh

      - name: Run isolated tests
        run: bash tools/plugin-rescue/test/run.sh
