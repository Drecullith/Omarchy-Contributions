name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin-rescue:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Syntax check
        run: |
          bash -n tools/plugin-rescue/bin/omrescue
          bash -n tools/plugin-rescue/install.sh
          bash -n tools/plugin-rescue/test/run.sh

      - name: Run isolated tests
        run: bash tools/plugin-rescue/test/run.sh

      - name: Installer smoke test
        run: |
          test_home="$(mktemp -d)"
          trap 'rm -rf "$test_home"' EXIT
          HOME="$test_home" bash tools/plugin-rescue/install.sh
          test -x "$test_home/.local/bin/omrescue"
          "$test_home/.local/bin/omrescue" version | grep -Fx 'omrescue 1.0.0'

  rollback-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Syntax check
        run: |
          bash -n tools/rollback-check/bin/omrollback-check
          python3 -m py_compile tools/rollback-check/bin/omrollback-plan
          bash -n tools/rollback-check/install.sh
          bash -n tools/rollback-check/test/run.sh
          bash -n tools/rollback-check/test/plan.sh

      - name: Run isolated checker tests
        run: bash tools/rollback-check/test/run.sh

      - name: Run isolated guided-recovery tests
        run: bash tools/rollback-check/test/plan.sh

      - name: Installer smoke test
        run: |
          test_home="$(mktemp -d)"
          trap 'rm -rf "$test_home"' EXIT
          HOME="$test_home" bash tools/rollback-check/install.sh
          test -x "$test_home/.local/bin/omrollback-check"
          test -x "$test_home/.local/bin/omrollback-plan"
          "$test_home/.local/bin/omrollback-check" version | grep -Fx 'omrollback-check 1.0.0'
          "$test_home/.local/bin/omrollback-plan" --version | grep -Fx 'omrollback-plan 1.0.0'

      - name: Verify root refusal
        run: |
          set +e
          output="$(sudo -H env HOME=/root tools/rollback-check/bin/omrollback-check 2>&1)"
          status=$?
          set -e
          test "$status" -eq 2
          grep -F 'Do not run omrollback-check as root' <<<"$output"

          set +e
          output="$(sudo -H env HOME=/root tools/rollback-check/bin/omrollback-plan --no-context 2>&1)"
          status=$?
          set -e
          test "$status" -eq 2
          grep -F 'Do not run omrollback-plan as root' <<<"$output"

  migration-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Syntax check
        run: |
          bash -n tools/migration-check/bin/ommigration-check
          bash -n tools/migration-check/install.sh
          bash -n tools/migration-check/test/run.sh

      - name: Run isolated tests
        run: bash tools/migration-check/test/run.sh

      - name: Installer smoke test
        run: |
          test_home="$(mktemp -d)"
          trap 'rm -rf "$test_home"' EXIT
          HOME="$test_home" bash tools/migration-check/install.sh
          test -x "$test_home/.local/bin/ommigration-check"
          "$test_home/.local/bin/ommigration-check" version | grep -Fx 'ommigration-check 1.0.0'

      - name: Verify root refusal
        run: |
          set +e
          output="$(sudo -H env HOME=/root tools/migration-check/bin/ommigration-check 2>&1)"
          status=$?
          set -e
          test "$status" -eq 2
          grep -F 'Do not run ommigration-check as root' <<<"$output"

  context-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Syntax check
        run: |
          python3 -m py_compile tools/context-snapshot/bin/omcontext tools/context-snapshot/lib/*.py
          bash -n tools/context-snapshot/install.sh
          bash -n tools/context-snapshot/test/run.sh

      - name: Run isolated tests
        run: bash tools/context-snapshot/test/run.sh

      - name: Installer smoke test
        run: |
          test_home="$(mktemp -d)"
          trap 'rm -rf "$test_home"' EXIT
          HOME="$test_home" bash tools/context-snapshot/install.sh
          test -x "$test_home/.local/bin/omcontext"
          "$test_home/.local/bin/omcontext" --version | grep -Fx 'omcontext 1.0.0'

      - name: Verify root refusal
        run: |
          test_home="$(mktemp -d)"
          trap 'rm -rf "$test_home"' EXIT
          set +e
          output="$(sudo -H env HOME="$test_home" tools/context-snapshot/bin/omcontext quick 2>&1)"
          status=$?
          set -e
          test "$status" -eq 2
          grep -F 'Do not run omcontext as root' <<<"$output"
